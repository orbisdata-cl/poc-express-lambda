name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  build:
    name: Lint & Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  n8n-review:
    name: AI Code Review
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n AI Review
        env:
          PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          curl -s -X POST https://automation.orbisdata.cl/webhook/github-pr-review \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  n8n-merge-metrics:
    name: Record Merge Metrics
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n Merge Metrics
        env:
          PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          curl -s -X POST https://automation.orbisdata.cl/webhook/github-pr-merged \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
